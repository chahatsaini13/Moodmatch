<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Match</title>
  <link rel="stylesheet" href="Main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Poppins:wght@300;500;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page-wrapper">
    <div class="overlay-container">
      <div class="header-bar">
        <h1 class="title">Mood Match</h1>
        <a href="/" class="back-button">
          <img src="Images/back.svg" alt="Back to Home" />
        </a>
      </div>
      <div class="generator-box">
        <h2 class="subtitle">Generate Your Emotion-Inspired Moodboard</h2>
        <p class="description">
          Describe your emotion or idea to get a moodboard tailored by AI, with visuals, fonts, and color harmony built to match.
        </p>
        <textarea id="prompt-input" class="input-box" placeholder="Enter your feelings or ideas here......"></textarea>
        <button class="generate-btn" id="generate-btn" onclick="handleGenerate()">Generate</button>
        <div id="loader" class="loader">
          <p id="loading-text">
              ✨ Understanding your emotion...
          </p>
          <div class="progress-track">
              <div id="progress-fill"></div>
          </div>
          <p id="progress-percent">0%</p>
        </div>
        <p id="status-msg"></p>
      </div>
      <div id="result-section">
        <div id="emotion-text" class="emotion-text"></div>
        <img id="moodboard-img" src="" alt="Generated Moodboard" />
        <a id="download-btn" download="moodboard.png">⬇ Download Moodboard</a>
      </div>
      <footer class="footer">
        <hr class="separator" />
        <div class="footer-text">
          <p class="team-member">Built by Chahat Saini, Navneet Sah & Yashika</p>
      </footer>
    </div>
  </div>
   <script>
    fetch('/api/warmup').catch(() => {});
    async function handleGenerate() {
        const input = document.getElementById('prompt-input');
        const statusMsg = document.getElementById('status-msg');
        const btn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const loadingText = document.getElementById('loading-text');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const resultSec = document.getElementById('result-section');
        const img = document.getElementById('moodboard-img');
        const dlBtn = document.getElementById('download-btn');
        const prompt = input.value.trim();
        if (!prompt) {
            statusMsg.className = "";
            statusMsg.textContent = "Please enter a mood or idea first.";
            return;
        }
        // Reset UI
        resultSec.classList.remove('visible');
        statusMsg.textContent = "";
        btn.disabled = true;
        loader.classList.add("active");
        let progress = 0;
        const interval = setInterval(() => {
            if (progress < 92) {
                progress++;
                progressFill.style.width = progress + "%";
                progressPercent.textContent = progress + "%";
                if (progress < 20) {
                    loadingText.textContent =
                        "✨ Understanding your emotion...";
                } else if (progress < 45) {
                    loadingText.textContent =
                        "🎨 Choosing colors & typography...";
                } else if (progress < 75) {
                    loadingText.textContent =
                        "🖼️ Finding matching images...";
    
                } else {
                    loadingText.textContent =
                        "📋 Creating your moodboard...";
                }
            }
        }, 500);
        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt
                })
            });
            const data = await res.json();
            if (!res.ok || data.error) {
                throw new Error(data.error || "Server Error");
            }
            clearInterval(interval);
            progressFill.style.width = "100%";
            progressPercent.textContent = "100%";
            loadingText.textContent = "✅ Moodboard ready!";
            const src = `data:image/png;base64,${data.image_b64}`;
            img.src = src;
            dlBtn.href = src;
            resultSec.classList.add("visible");
        }
        catch (err) {
            clearInterval(interval);
            statusMsg.textContent = "Error: " + err.message;
    
        }
        finally {
            setTimeout(() => {
                loader.classList.remove("active");
                progressFill.style.width = "0%";
                progressPercent.textContent = "0%";
                btn.disabled = false;
            }, 800);
        }
    }
    document.addEventListener("keydown", e => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            handleGenerate();
        }
    });
</script>
</body>
</html>
